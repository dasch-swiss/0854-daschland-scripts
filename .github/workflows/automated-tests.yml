---
name: Automated Tests

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-generate:
    if: github.event.head_commit.author.name != 'daschbot'
    runs-on: ubuntu-latest
    outputs:
      changes_pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: 'false'  # take care not to exceed the monthly quota
          # https://docs.github.com/en/billing/managing-billing-for-your-products/managing-billing-for-git-large-file-storage
          ref: ${{ github.event.pull_request.head.ref || github.ref }}  # checkout current PR branch
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python dependencies (uv will install python automatically, if no appropriate version is installed)
        run: uv sync --all-extras --dev
      - name: Upgrade DSP-TOOLS
        run: uv add --upgrade dsp-tools
      - name: Install ExifTool
        run: sudo apt-get update && sudo apt-get install -y exiftool
      - name: Generate XML and CSV files
        run: uv run src/xmllib/xmllib_main.py
        env:
          XMLLIB_SORT_RESOURCES: "true"
          XMLLIB_SORT_PROPERTIES: "true"
          XMLLIB_AUTHORSHIP_ID_WITH_INTEGERS: "true"
      - name: Configure git
        run: |
          git config user.name "daschbot"
          git config user.email "daschbot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.DASCHBOT_PAT }}@github.com/dasch-swiss/daschland-scripts.git"
          git checkout ${{ github.event.pull_request.head.ref }}
      - name: Commit and push if changed
        id: push
        run: |
          git add data/output/data_daschland.xml data/processed/*.csv
          if ! git diff --staged --quiet; then
            git commit -m "Auto-generate XML and CSV files"
            git push
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "No changes to commit"
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

  lint:
    needs: auto-generate
    if: |
      always() && !failure() && !cancelled() &&
      (needs.auto-generate.result == 'skipped' || needs.auto-generate.outputs.changes_pushed == 'false')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: 'false'  # take care not to exceed the monthly quota 
          # https://docs.github.com/en/billing/managing-billing-for-your-products/managing-billing-for-git-large-file-storage
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python dependencies (uv will install python automatically, if no appropriate version is installed)
        run: uv sync --all-extras --dev
        shell: bash
      - name: Linting with ruff
        run: just ruff-check --output-format=github
      - name: Check formatting with ruff
        run: just ruff-format-check
      - name: Linting with mypy
        run: just mypy
      - name: Run vulture
        run: just vulture

  xmlupload:
    uses: ./.github/workflows/xmlupload-reusable.yml
    needs: auto-generate
    if: |
      always() && !failure() && !cancelled() &&
      (needs.auto-generate.result == 'skipped' || needs.auto-generate.outputs.changes_pushed == 'false')
