---
name: Recreate Alice on Demo

on:
  schedule:
    # Every Monday at 13:00 UTC (14:00 CET / 15:00 CEST). GitHub cron is UTC and ignores DST.
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write  # needed to push the 'demo-uploaded-*' marker tags

env:
  # Password for the users defined in the JSON (Cheshire Cat et al.). 'create' substitutes it into
  # the "password": null fields, and 'xmlupload' authenticates with it as cheshire.cat@dasch.swiss.
  DSP_USER_PASSWORD: ${{ secrets.USER_PASSWORD_CHESHIRE_CAT }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need full history + tags to diff against the last upload
          filter: blob:none  # skip downloading blob content; only 2 files' content is ever read
      - name: Check whether the project data changed since the last upload to demo
        id: diff
        run: |
          # Marker names carry a UTC timestamp, so sorting by refname is chronological.
          last="$(git tag -l 'demo-uploaded-*' --sort=-refname | head -1)"
          if [ -z "$last" ]; then
            echo "No 'demo-uploaded-*' marker yet; treating this as the first upload."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$last" HEAD -- data/output/daschland.json data/output/data_daschland.xml; then
            echo "No changes since $last; skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Project data changed since $last; re-uploading."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  recreate:
    needs: detect-changes
    if: needs.detect-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          lfs: 'true'  # take care not to exceed the monthly quota
          # https://docs.github.com/en/billing/managing-billing-for-your-products/managing-billing-for-git-large-file-storage
          fetch-depth: 0  # need tags to record the upload marker
          filter: blob:none  # skip downloading blob content; only HEAD's files are ever read
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install Python & dependencies (allow upgrade, in order to get most up-to-date DSP-TOOLS)
        run: uv sync --all-extras --upgrade
      - name: Upgrade DSP-TOOLS
        run: uv add --upgrade dsp-tools
      - name: Erase the existing project from demo
        run: uv run python -m src.demo_upload erase
        env:
          DASCH_USER_PW_PROD: ${{ secrets.DASCH_USER_PW_PROD }}
      - name: Create project
        run: |
          uv run dsp-tools create \
          --suppress-update-prompt \
          -s api.demo.dasch.swiss \
          -u dasch@dasch.swiss \
          -p "$PW" \
          data/output/daschland.json
        env:
          PW: ${{ secrets.DASCH_USER_PW_PROD }}
      - name: Upload data
        run: |
          uv run dsp-tools xmlupload \
          --suppress-update-prompt \
          -s api.demo.dasch.swiss \
          -u cheshire.cat@dasch.swiss \
          -p "$DSP_USER_PASSWORD" \
          data/output/data_daschland.xml
      - name: Determine the new project URL
        id: project_url
        run: |
          url="$(uv run -q python -m src.demo_upload project-url)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Remind Daniela to update the portal link (Linear)
        run: uv run python -m src.demo_upload notify --url "$URL"
        env:
          URL: ${{ steps.project_url.outputs.url }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      - name: Record the upload marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="demo-uploaded-$(date -u +'%Y%m%dT%H%M%SZ')"
          git tag -a "$tag" -m "Uploaded to demo: $URL"
          git push origin "refs/tags/$tag"
        env:
          URL: ${{ steps.project_url.outputs.url }}
